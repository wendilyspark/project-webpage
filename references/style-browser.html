<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Webpage — Style Browser</title>
<style>
/* One page to browse every style. Overview grid first; a button per style
   opens it live, full width. Works straight from the file system. */
:root{
  --ink:#16191d; --ink-2:#3d434b; --muted:#6b737d;
  --ground:#f4f5f7; --card:#ffffff; --line:#dfe2e6;
  --bar:#1b1f24; --bar-2:#2a3038; --on-bar:#e9ebee; --on-bar-2:#9aa3ad;
  --accent:#3b6fd8;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;
  --bar-h:auto;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--ground);color:var(--ink);font:15px/1.5 var(--sans);display:flex;flex-direction:column}

/* ---------- header with one button per style ---------- */
header{background:var(--bar);color:var(--on-bar);position:sticky;top:0;z-index:10;border-bottom:1px solid #000}
.top{display:flex;align-items:baseline;gap:14px;padding:14px 20px 4px;flex-wrap:wrap}
.top h1{font-size:15px;font-weight:650;margin:0;letter-spacing:-.01em}
.top .hint{font-size:12.5px;color:var(--on-bar-2)}
nav{display:flex;gap:6px;padding:10px 20px 14px;overflow-x:auto;scrollbar-width:thin}
nav button{
  flex:0 0 auto;font:500 12.5px/1 var(--sans);color:var(--on-bar);
  background:var(--bar-2);border:1px solid transparent;border-radius:6px;
  padding:8px 12px;cursor:pointer;white-space:nowrap;
}
nav button:hover{border-color:#4a525c}
nav button[aria-current="true"]{background:var(--on-bar);color:var(--bar)}
nav .sep{flex:0 0 1px;background:#3a414a;margin:2px 4px}

/* ---------- overview ---------- */
#overview{padding:28px 20px 48px;max-width:1320px;width:100%;margin:0 auto}
#overview .lead{color:var(--ink-2);margin:0 0 22px;max-width:70ch}
.grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;
  cursor:pointer;text-align:left;padding:0;font:inherit;color:inherit;
  display:flex;flex-direction:column;transition:transform .12s ease, box-shadow .12s ease;
}
.card:hover,.card:focus-visible{transform:translateY(-2px);box-shadow:0 8px 24px rgba(20,24,30,.12);outline:none}
.card:focus-visible{box-shadow:0 0 0 3px var(--accent)}
.card .shot{aspect-ratio:4/5;background:#e9ecef center top/cover no-repeat;border-bottom:1px solid var(--line)}
.card .meta{padding:12px 14px 14px}
.card .name{font-weight:650;font-size:15px;display:flex;gap:8px;align-items:center}
.card .tag{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--accent);border:1px solid currentColor;border-radius:4px;padding:1px 6px}
.card .desc{color:var(--muted);font-size:13px;margin-top:3px}

/* ---------- single style ---------- */
#viewer{display:none;flex:1;flex-direction:column;min-height:0}
#viewer.on{display:flex}
.cap{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 20px;background:var(--card);border-bottom:1px solid var(--line)}
.cap .name{font-weight:650}
.cap .desc{color:var(--muted);font-size:13.5px}
.cap .say{margin-left:auto;font-size:12.5px;color:var(--ink-2);background:var(--ground);border:1px solid var(--line);border-radius:6px;padding:5px 10px}
.cap .say b{font-weight:650}
.step{font:500 12.5px/1 var(--sans);background:transparent;border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer;color:var(--ink-2)}
.step:hover{border-color:var(--ink-2)}
iframe{flex:1;width:100%;border:0;background:#fff;min-height:70vh}

@media (max-width:640px){
  .top{padding:12px 14px 2px} nav{padding:8px 14px 12px}
  #overview{padding:20px 14px 40px}
  .cap{padding:10px 14px} .cap .say{margin-left:0}
}
</style>
</head>
<body>

<header>
  <div class="top">
    <h1>Project Webpage — choose a style</h1>
    <span class="hint">Every style shows the same sample project. Pick one, then tell Claude its name. ← → to step through.</span>
  </div>
  <nav id="nav" aria-label="Styles"></nav>
</header>

<main id="overview">
  <p class="lead">Thirteen designs for the same case study. Click any thumbnail, or a button above, to open that style at full size.</p>
  <div class="grid" id="grid"></div>
</main>

<section id="viewer" aria-live="polite">
  <div class="cap">
    <button class="step" id="prev" aria-label="Previous style">←</button>
    <button class="step" id="next" aria-label="Next style">→</button>
    <span class="name" id="vName"></span>
    <span class="desc" id="vDesc"></span>
    <span class="say">To use it, tell Claude: <b id="vSay"></b></span>
  </div>
  <iframe id="frame" title="Style preview"></iframe>
</section>

<script>
const STYLES = [
  {id:"harbour",            name:"Harbour",            file:"themes/harbour.html",            desc:"The original and default — navy, sky blue and brass gold", tag:"Default"},
  {id:"editorial",          name:"Editorial",          file:"template.html",                  desc:"Canonical editorial design system"},
  {id:"accented",           name:"Accented",           file:"themes/accented.html",           desc:"Navy section bands on a cool blue-grey ground"},
  {id:"mat",                name:"Mat",                file:"themes/mat.html",                desc:"Forest green and cream environments"},
  {id:"raw-grid",           name:"Raw Grid",           file:"themes/raw-grid.html",           desc:"Neobrutalist block grid with offset shadows"},
  {id:"monochrome",         name:"Monochrome",         file:"themes/monochrome.html",         desc:"An accounting ledger in black on white"},
  {id:"cartesian",          name:"Cartesian",          file:"themes/cartesian.html",          desc:"Museum monograph with framed plates"},
  {id:"cobalt-grid",        name:"Cobalt Grid",        file:"themes/cobalt-grid.html",        desc:"Engineering drawing sheet on graph paper"},
  {id:"emerald-editorial",  name:"Emerald Editorial",  file:"themes/emerald-editorial.html",  desc:"Magazine feature with masthead and columns"},
  {id:"blue-professional",  name:"Blue Professional",  file:"themes/blue-professional.html",  desc:"Product docs with a sidebar table of contents"},
  {id:"editorial-tri-tone", name:"Editorial Tri-Tone", file:"themes/editorial-tri-tone.html", desc:"Poster report in blush, butter and crimson"},
  {id:"biennale-yellow",    name:"Biennale Yellow",    file:"themes/biennale-yellow.html",    desc:"Exhibition catalogue with alternating rooms"},
  {id:"signal",             name:"Signal",             file:"themes/signal.html",             desc:"Sticky side rail, navy bands on cream"},
];

const $ = id => document.getElementById(id);
const nav = $("nav"), grid = $("grid"), overview = $("overview"), viewer = $("viewer"), frame = $("frame");
let current = -1;

function btn(label, onClick, key){
  const b = document.createElement("button");
  b.type = "button"; b.textContent = label; b.dataset.key = key; b.addEventListener("click", onClick);
  return b;
}

nav.appendChild(btn("All styles", () => go(-1), "all"));
const sep = document.createElement("span"); sep.className = "sep"; nav.appendChild(sep);
STYLES.forEach((s, i) => {
  nav.appendChild(btn(s.name, () => go(i), s.id));
  const c = document.createElement("button");
  c.type = "button"; c.className = "card"; c.addEventListener("click", () => go(i));
  c.innerHTML =
    `<div class="shot" style="background-image:url('thumbnails/${s.id}.jpg')" role="img" aria-label="${s.name} preview"></div>` +
    `<div class="meta"><div class="name">${s.name}${s.tag ? `<span class="tag">${s.tag}</span>` : ""}</div>` +
    `<div class="desc">${s.desc}</div></div>`;
  grid.appendChild(c);
});

function go(i, push = true){
  current = i;
  nav.querySelectorAll("button").forEach(b =>
    b.setAttribute("aria-current", String(i < 0 ? b.dataset.key === "all" : b.dataset.key === STYLES[i].id)));
  if (i < 0){
    viewer.classList.remove("on"); overview.style.display = ""; frame.removeAttribute("src");
    document.title = "Project Webpage — Style Browser";
    if (push) history.replaceState(null, "", location.pathname);
    window.scrollTo(0, 0);
    return;
  }
  const s = STYLES[i];
  overview.style.display = "none"; viewer.classList.add("on");
  frame.src = s.file;
  $("vName").textContent = s.name; $("vDesc").textContent = s.desc;
  $("vSay").textContent = `“use ${s.name}”`;
  document.title = `${s.name} — Style Browser`;
  if (push) history.replaceState(null, "", "#" + s.id);
  nav.querySelector(`[data-key="${s.id}"]`).scrollIntoView({block:"nearest", inline:"nearest"});
}

const step = d => go(current < 0 ? (d > 0 ? 0 : STYLES.length - 1) : (current + d + STYLES.length) % STYLES.length);
$("prev").addEventListener("click", () => step(-1));
$("next").addEventListener("click", () => step(1));
document.addEventListener("keydown", e => {
  if (e.target.closest && e.target.closest("input,textarea")) return;
  if (e.key === "ArrowRight") step(1);
  else if (e.key === "ArrowLeft") step(-1);
  else if (e.key === "Escape") go(-1);
});

const start = STYLES.findIndex(s => "#" + s.id === location.hash);
go(start, false);
</script>
</body>
</html>
